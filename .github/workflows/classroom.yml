# Autograding for GitHub Classroom. Generated from tests/grading.txt.
# Total: 100 points.
name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: 'Build (compiles)'
      id: build
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Build (compiles)'
        setup-command: ''
        command: 'make -s build/thesaurus'
        timeout: 2
        max-score: 5
    - name: 'No compiler warnings (-Werror)'
      id: no_warnings
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'No compiler warnings (-Werror)'
        setup-command: ''
        command: 'make -s werror'
        timeout: 2
        max-score: 5
    - name: 'Example from the booklet (drink)'
      id: example
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Example from the booklet (drink)'
        setup-command: ''
        command: 'make -s build/thesaurus && tests/run_tests.sh 01_example'
        timeout: 2
        max-score: 10
    - name: 'Several words, first synonym, duplicates'
      id: several_words
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Several words, first synonym, duplicates'
        setup-command: ''
        command: 'make -s build/thesaurus && tests/run_tests.sh 02_several_words'
        timeout: 2
        max-score: 10
    - name: 'Nothing to replace'
      id: no_match
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Nothing to replace'
        setup-command: ''
        command: 'make -s build/thesaurus && tests/run_tests.sh 03_no_match'
        timeout: 2
        max-score: 5
    - name: 'Whole words only, case-sensitive'
      id: whole_words
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Whole words only, case-sensitive'
        setup-command: ''
        command: 'make -s build/thesaurus && tests/run_tests.sh 04_whole_words_case'
        timeout: 2
        max-score: 10
    - name: 'Tabs, CRLF, digits, no final newline'
      id: whitespace
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Tabs, CRLF, digits, no final newline'
        setup-command: ''
        command: 'make -s build/thesaurus && tests/run_tests.sh 05_whitespace_and_symbols'
        timeout: 2
        max-score: 10
    - name: 'Empty text / empty thesaurus'
      id: empty_files
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Empty text / empty thesaurus'
        setup-command: ''
        command: 'make -s build/thesaurus && tests/run_tests.sh 06_empty_text 07_empty_thesaurus'
        timeout: 2
        max-score: 5
    - name: 'Very long words (thousands of letters)'
      id: long_words
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Very long words (thousands of letters)'
        setup-command: ''
        command: 'make -s build/thesaurus && tests/run_tests.sh 08_long_words'
        timeout: 2
        max-score: 10
    - name: 'Big input (1.5 MB text, 20000 entries)'
      id: big
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Big input (1.5 MB text, 20000 entries)'
        setup-command: ''
        command: 'make -s build/thesaurus && tests/run_tests.sh 09_big'
        timeout: 2
        max-score: 10
    - name: 'Errors: bad arguments / missing files'
      id: errors
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Errors: bad arguments / missing files'
        setup-command: ''
        command: 'make -s build/thesaurus && tests/run_tests.sh errors'
        timeout: 2
        max-score: 10
    - name: 'Memory: no leaks / invalid access (ASan)'
      id: memory
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Memory: no leaks / invalid access (ASan)'
        setup-command: ''
        command: 'make -s build/thesaurus_asan && tests/run_tests.sh --asan 01_example 02_several_words 05_whitespace_and_symbols 06_empty_text 08_long_words errors'
        timeout: 2
        max-score: 10
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        BUILD_RESULTS: "${{steps.build.outputs.result}}"
        NO_WARNINGS_RESULTS: "${{steps.no_warnings.outputs.result}}"
        EXAMPLE_RESULTS: "${{steps.example.outputs.result}}"
        SEVERAL_WORDS_RESULTS: "${{steps.several_words.outputs.result}}"
        NO_MATCH_RESULTS: "${{steps.no_match.outputs.result}}"
        WHOLE_WORDS_RESULTS: "${{steps.whole_words.outputs.result}}"
        WHITESPACE_RESULTS: "${{steps.whitespace.outputs.result}}"
        EMPTY_FILES_RESULTS: "${{steps.empty_files.outputs.result}}"
        LONG_WORDS_RESULTS: "${{steps.long_words.outputs.result}}"
        BIG_RESULTS: "${{steps.big.outputs.result}}"
        ERRORS_RESULTS: "${{steps.errors.outputs.result}}"
        MEMORY_RESULTS: "${{steps.memory.outputs.result}}"
      with:
        runners: build,no_warnings,example,several_words,no_match,whole_words,whitespace,empty_files,long_words,big,errors,memory
